name: Deploy

on:
  push:
    branches: [main]

jobs:
  ansible:
    runs-on: ubuntu-latest

    steps:
      - name: Check required secrets
        run: |
          missing=()
          [ -z "$AWS_KEY" ]    && missing+=("AWS_ACCESS_KEY_ID")
          [ -z "$AWS_SECRET" ] && missing+=("AWS_SECRET_ACCESS_KEY")
          [ -z "$ANSIBLE_ID" ] && missing+=("ANSIBLE_INSTANCE_ID")
          [ -z "$APP_IP" ]     && missing+=("APP_SERVER_IP")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "Missing secrets: ${missing[*]}"
            exit 1
          fi
        env:
          AWS_KEY:    ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          ANSIBLE_ID: ${{ secrets.ANSIBLE_INSTANCE_ID }}
          APP_IP:     ${{ secrets.APP_SERVER_IP }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            eu-west-1

      - name: Run playbook via SSM
        env:
          ANSIBLE_ID: ${{ secrets.ANSIBLE_INSTANCE_ID }}
          APP_IP:     ${{ secrets.APP_SERVER_IP }}
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --region eu-west-1 \
            --instance-id "$ANSIBLE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "$(jq -n \
              --arg ip "$APP_IP" \
              '{commands:[
                "cd /tmp && rm -rf assessment_1 && git clone --depth 1 https://github.com/NormStorm009/assessment_1.git",
                ("ANSIBLE_COLLECTIONS_PATHS=/usr/share/ansible/collections ansible-playbook /tmp/assessment_1/rewards_terraform/playbooks/deploy_app.yml -i \""+$ip+",\" --private-key /opt/ansible/app_server.pem -u ec2-user -e \"app_port=5001 docker_image=normstorm009/sample:latest\"")
              ]}')" \
            --output text --query "Command.CommandId")

          echo "Command: $COMMAND_ID"

          aws ssm wait command-executed \
            --region eu-west-1 \
            --command-id "$COMMAND_ID" \
            --instance-id "$ANSIBLE_ID"

          STATUS=$(aws ssm get-command-invocation \
            --region eu-west-1 \
            --command-id "$COMMAND_ID" \
            --instance-id "$ANSIBLE_ID" \
            --query "StatusDetails" --output text)

          echo "Result: $STATUS"
          [ "$STATUS" = "Success" ] || exit 1
